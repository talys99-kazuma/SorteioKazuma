<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorteio do Kazuma</title>
  <style>
   :root {
      --bg:#f0f0f0;
      --bg-soft:#f7f0eb;
      --panel:#f9f5f2;
      --panel-strong:#fffdfb;
      --card:#f3ece7;
      --heading:#7c5b52;
      --heading-strong:#5d473f;
      --accent:#417d7b;
      --accent-strong:#2d5e5c;
      --gold:#e9c378;
      --gold-strong:#d9ac56;
      --text:#545662;
      --muted:#7a7e8b;
      --line:rgba(124,91,82,.18);
      --shadow:rgba(84,86,98,.14);
      --danger:#b66861;
      --white:#fffdfb;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; 
      min-height:100vh;
      color:var(--text);
      background:linear-gradient(180deg, #f0f0f0 0%, #f7efe9 27%, #eef3f2 100%);
      font-family:Arial,Helvetica,sans-serif;
    }
    .site-header {
    border-bottom:1px solid rgba(32,82,145,.35); 
    background:rgba(255,255,255,.72); 
    }
    .header-inner { width:min(1140px,calc(100% - 32px)); 
      margin:auto; 
      min-height:78px; 
      display:flex; 
      align-items:center; 
      justify-content:space-between; 
      gap:24px; 
    }
    .brand { 
      display:flex; 
      align-items:center; 
      gap:10px; 
      color:var(--white); 
      text-decoration:none; 
      font-weight:800; 
      line-height:1; 
     }
    .brand img {
      width:92px;
      height:auto;
      display:block;
      filter:drop-shadow(0 10px 18px rgba(124,91,82,.12));
     }

    .brand-name span { 
      display:block; 
    }
    .brand-name {
      font-size:clamp(18px,1.9vw,31px);
      letter-spacing:-0.04em;
      color:var(--heading);
    } 
    .brand-name span:last-child { 
      color:var(--accent); 
    }
    nav { 
      display:flex; 
      align-items:center; 
      gap:30px; 
    }
    nav a { 
      color:var(--text); 
      text-decoration:none; 
      font-size:15px; 
      padding:29px 0; 
      border-bottom:2px 
      solid transparent; 
    }
    nav a:hover, nav a.active { 
      color:var(--heading); 
      border-color:var(--gold); 
    }
    .login { display:flex; 
      align-items:center; gap:8px; 
      border:0; border-radius:10px; 
      padding:13px 20px; 
      color:var(--heading-strong); 
      background:linear-gradient(135deg,var(--gold),#d9b66d); 
      font-weight:700; 
      box-shadow:0 10px 20px rgba(233,195,120,.22); 
    }
    .login:hover,.primary:hover { 
      filter:brightness(1.12); 
    }
    .main { width:min(1140px,calc(100% - 32px)); 
      margin:auto; 
      margin-top:10px; 
    }
    .section { 
      padding:78px 0; 
    }
    .section-heading {
      text-align:center;
      margin-bottom:42px;
      padding:28px 12px 12px;
    }
    .kicker {
      color:var(--accent);
      font-size:clamp(40px,5vw,90px);
      font-weight:800;
      letter-spacing:-0.05em;
      text-transform:uppercase;
      line-height:0.96;
    }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:clamp(34px,5vw,58px); line-height:1.08; letter-spacing:-1.5px; }
    h2 { font-size:clamp(28px,4vw,42px); color:var(--heading-strong); }
    .subheading {
      margin-top:12px;
      color:var(--text);
      line-height:1.70;
      font-size:clamp(18px,2vw,20px);
      font-weight:500;
    }

    .steps { display:grid; grid-template-columns:repeat(4,1fr); gap:28px; }
    .step { position:relative; text-align:center; }
    .step-icon { width:88px; height:88px; margin:auto; display:grid; place-items:center; border:1px solid rgba(65,125,123,.25); border-radius:20px; color:var(--accent); background:rgba(65,125,123,.08); box-shadow:inset 0 0 25px rgba(65,125,123,.06); }
    .step-icon svg { width:38px; height:38px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .step-title { margin-top:18px; display:flex; align-items:center; justify-content:center; gap:9px; font-weight:700; color:var(--heading-strong); }
    .step-number { width:27px; height:27px; display:grid; place-items:center; border-radius:50%; color:var(--white); background:linear-gradient(135deg,var(--accent),var(--heading)); font-size:13px; }
    .step p { margin-top:10px; color:var(--muted); font-size:14px; line-height:1.6; }
    .sort-wrap { padding-bottom:84px; }
    .sort-panel {
      border:1px solid var(--line);
      border-radius:22px;
      padding:28px;
      background:linear-gradient(145deg, rgba(255,255,255,.9), rgba(243,236,231,.92));
      box-shadow:0 26px 70px var(--shadow);
    }
    .sort-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
    .sort-head h2 { font-size:27px; }
    .count { display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:99px; color:var(--accent-strong); background:rgba(65,125,123,.12); font-size:13px; font-weight:700; white-space:nowrap; }
    .form-row { display:flex; gap:10px; margin-top:25px; }
    .form-row input {
      min-width:0;
      flex:1;
      border:1px solid rgba(124,91,82,.25);
      border-radius:11px;
      padding:14px 16px;
      color:var(--text);
      background:var(--panel-strong);
      outline:none;
      box-shadow:inset 0 1px 3px rgba(84,86,98,.04);
    }
    .form-row input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(65,125,123,.12); }
    .add {
      width:50px;
      border:0;
      border-radius:11px;
      color:var(--heading-strong);
      background:linear-gradient(135deg,var(--gold),var(--gold-strong));
      font-size:26px;
      box-shadow:0 12px 25px rgba(233,195,120,.22);
    }
    .error { min-height:20px; margin-top:10px; color:var(--danger); font-size:13px; font-weight:700; }
    .columns { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:10px; }
    .list-panel {
      min-height:245px;
      border:1px solid rgba(124,91,82,.18);
      border-radius:16px;
      padding:18px;
      background:rgba(255,255,255,.5);
    }
    .list-panel.winner { border-color:rgba(65,125,123,.7); background:rgba(65,125,123,.06); }
    .list-panel h3 { text-align:center; font-size:21px; margin-bottom:16px; color:var(--heading); }
    ol { display:grid; gap:9px; margin:0; padding:0; list-style:none; }
    li {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border:1px solid rgba(124,91,82,.12);
      border-radius:10px;
      padding:11px 12px;
      background:rgba(255,255,255,.72);
    }
    .person { display:flex; align-items:center; gap:10px; min-width:0; font-weight:700; color:var(--text); }
    .index {
      width:27px;
      height:27px;
      flex:none;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:var(--white);
      background:linear-gradient(135deg,var(--accent),var(--heading));
      font-size:12px;
    }
    .remove { border:0; color:var(--muted); background:transparent; font-size:19px; }
    .remove:hover { color:var(--danger); }
    .empty { min-height:175px; display:grid; place-items:center; color:var(--muted); text-align:center; font-size:14px;  font-weight: bold;}
    .actions { display:flex; gap:11px; margin-top:22px; }
    .primary,.secondary { display:flex; flex:1; align-items:center; justify-content:center; gap:9px; border-radius:11px; padding:14px 18px; font-weight:800; }
    .primary {
      border:0;
      color:var(--white);
      background:linear-gradient(135deg,var(--accent),var(--accent-strong));
      box-shadow:0 16px 30px rgba(65,125,123,.22);
    }
    .secondary {
      border:1px solid rgba(124,91,82,.35);
      color:var(--heading-strong);
      background:rgba(255,255,255,.45);
    }
    .secondary:hover { background:rgba(124,91,82,.04); }
    button:disabled { cursor:not-allowed; }
    .footer { border-top:1px solid var(--line); padding:25px 16px; color:var(--heading); font-weight: 800; text-align:center; background: rgba(255, 255, 255, .72); border-top: 1px solid rgba(32, 82, 145, .35);}
    .footer strong { font-weight: 800; color: var(--accent);}
    @media (max-width:800px) { nav { display:none; } .steps { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:560px) { .header-inner { min-height:70px; } .brand-name { font-size:14px; } .login { padding:11px 13px; } .section { padding:55px 0; } .steps,.columns { grid-template-columns:1fr; } .sort-panel { padding:18px; } .sort-head { flex-direction:column; } .form-row,.actions { flex-direction:column; } .add { width:100%; height:48px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#inicio" aria-label="Sorteio do Kazuma">
        <img src="image-removebg-preview (9).png" style="width:100px; margin-top: 5px;">
        <span class="brand-name">Sorteio do<br><span>Kazuma</span>
      </a>
    </div>
  </header>

  <main id="inicio" class="main">


    <section id="sorteio" class="sort-wrap">
      <div class="section-heading"><div class="kicker">SEU MOMENTO DE SORTE</div><p class="subheading">Adicione os participantes e deixe o Kazuma escolher por você.</p></div>
      <div class="sort-panel">
        <div class="sort-head"><div><h2>Nomes participantes</h2><p class="subheading">Adicione pelo menos duas pessoas para começar.</p></div><div class="count">● <span id="contador">0 nomes</span></div></div>
        <form class="form-row" id="formulario"><label for="nome" hidden>Nome do participante</label><input id="nome" autocomplete="off" placeholder="Digite um nome..." maxlength="60"><button class="add" type="submit" aria-label="Adicionar nome">+</button></form>
        <div class="error" id="erro" role="alert"></div>
        <div class="columns"><section class="list-panel"><h3>Nomes</h3><ol id="listaNomes"><div class="empty">Sua lista está vazia.</div></ol></section><section class="list-panel winner"><h3>Sorteados</h3><ol id="listaSorteados"><div class="empty">Nomes Sorteados.</div></ol></section></div>
        <div class="actions"><button class="primary" id="sortear" type="button" disabled>Sortear um nome</button><button class="secondary" id="limpar" type="button">Limpar lista</button></div>
      </div>
    </section>
  </main>
  <footer id="contato" class="footer">Sorteio do <strong>Kazuma</strong></footer>

  <script>
    const nomes = [];
    const sorteados = [];
    let sorteando = false;

    const $ = id => document.getElementById(id);
    const form = $('formulario'), input = $('nome'), erro = $('erro'),
          contador = $('contador'), lista = $('listaNomes'),
          resultado = $('listaSorteados'), sortear = $('sortear');

    function mensagem(texto='') {
      erro.textContent = texto;
    }

    function atualizar() {
      const disponiveis = nomes.filter(nome =>
        !sorteados.some(sorteado => sorteado.toLowerCase() === nome.toLowerCase())
      );

      contador.textContent = `${nomes.length} ${nomes.length === 1 ? 'nome' : 'nomes'}`;

      // O sorteio só pode acontecer se houver pelo menos 2 nomes disponíveis.
      sortear.disabled = sorteando || disponiveis.length < 2;

      lista.innerHTML = nomes.length
        ? nomes.map((nome, i) => {
            const jaSorteado = sorteados.some(
              sorteado => sorteado.toLowerCase() === nome.toLowerCase()
            );

            return `<li>
              <span class="person">
                <span class="index">${i + 1}</span>
                <span>${nome}${jaSorteado ? ' ✓' : ''}</span>
              </span>
              <button class="remove" type="button" aria-label="Remover ${nome}" onclick="remover(${i})">×</button>
            </li>`;
          }).join('')
        : '<div class="empty">Sua lista está vazia.</div>';

      // Mostra TODOS os nomes sorteados, na ordem em que foram sorteados.
      resultado.innerHTML = sorteados.length
        ? sorteados.map((nome, i) => `<li>
            <span class="person">
              <span class="index">${i + 1}</span>
              <span>${nome}</span>
            </span>
          </li>`).join('')
        : '<div class="empty">O resultado aparecerá aqui.</div>';

      if (!sorteando && nomes.length >= 2 && disponiveis.length < 2) {
        sortear.textContent = 'Todos os nomes foram sorteados';
      } else if (!sorteando) {
        sortear.textContent = 'Sortear um nome';
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();

      const nome = input.value.trim();

      if (!nome) {
        return mensagem('Digite um nome para adicionar.');
      }

      if (nomes.some(item => item.toLowerCase() === nome.toLowerCase())) {
        return mensagem('Esse nome já está na lista.');
      }

      nomes.push(nome);
      input.value = '';
      mensagem();
      atualizar();
      input.focus();
    });

    window.remover = index => {
      const nomeRemovido = nomes[index];

      // Remove o participante da lista principal.
      nomes.splice(index, 1);

      // Se ele já tiver sido sorteado, remove também do histórico de sorteados.
      const indiceSorteado = sorteados.findIndex(
        nome => nome.toLowerCase() === nomeRemovido.toLowerCase()
      );

      if (indiceSorteado !== -1) {
        sorteados.splice(indiceSorteado, 1);
      }

      mensagem();
      atualizar();
    };

    sortear.addEventListener('click', () => {
      const disponiveis = nomes.filter(nome =>
        !sorteados.some(sorteado => sorteado.toLowerCase() === nome.toLowerCase())
      );

      if (disponiveis.length < 2) {
        return mensagem(
          disponiveis.length === 1
            ? 'É preciso adicionar mais um nome para continuar o sorteio.'
            : 'Todos os nomes já foram sorteados.'
        );
      }

      mensagem();
      sorteando = true;
      sortear.disabled = true;
      sortear.textContent = 'Sorteando...';
      resultado.innerHTML = '<div class="empty">Escolhendo um nome...</div>';

      setTimeout(() => {
        // O sorteio acontece SOMENTE entre os nomes que ainda não foram sorteados.
        const novoSorteado =
          disponiveis[Math.floor(Math.random() * disponiveis.length)];

        sorteados.push(novoSorteado);
        sorteando = false;
        atualizar();
      }, 900);
    });

    $('limpar').addEventListener('click', () => {
      nomes.length = 0;
      sorteados.length = 0;
      sorteando = false;
      mensagem();
      atualizar();
      input.focus();
    });

    atualizar();
  </script>
</body>
</html>
